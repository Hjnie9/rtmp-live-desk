name: rtmp_live_desk
description: RTMP ingest and live preview for Windows desktops.
publish_to: none
version: 1.0.1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  path: 1.9.1
  window_manager: 0.5.1

dev_dependencies:
  flutter_lints: 6.0.0

dependency_overrides:
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video

flutter:
  uses-material-design: true
  assets:
    - assets/desk.png
